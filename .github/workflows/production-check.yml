name: production-check

on:
  push:
    branches:
      - feature/store-production-readiness-sprint-1
      - feat/multi-vendor-stores
      - main
  pull_request:
    branches:
      - feature/store-production-readiness-sprint-1
      - feat/multi-vendor-stores
      - main

permissions:
  contents: write

concurrency:
  group: production-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, Typecheck, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate production launch bundle
        run: node scripts/build-launch-bundle.mjs

      - name: Commit regenerated launch bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- supabase/launch_bundle.sql; then
            echo "Launch bundle already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/launch_bundle.sql
          git commit -m "build(db): regenerate production launch bundle"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Audit ordered migrations
        run: npm run test:migrations

      - name: Upload generated launch bundle
        uses: actions/upload-artifact@v4
        with:
          name: generated-launch-bundle
          path: supabase/launch_bundle.sql
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        env:
          NITRO_PRESET: node-server
        run: npm run build
