name: production-check

on:
  push:
    branches:
      - feature/store-production-readiness-sprint-1
      - feat/multi-vendor-stores
      - main
  pull_request:
    branches:
      - feature/store-production-readiness-sprint-1
      - feat/multi-vendor-stores
      - main

permissions:
  contents: read

concurrency:
  group: production-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, Typecheck, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate production launch bundle
        run: node scripts/build-launch-bundle.mjs

      - name: Audit ordered migrations
        run: npm run test:migrations

      - name: Upload generated launch bundle
        uses: actions/upload-artifact@v4
        with:
          name: generated-launch-bundle
          path: supabase/launch_bundle.sql
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        env:
          NITRO_PRESET: node-server
        run: npm run build
